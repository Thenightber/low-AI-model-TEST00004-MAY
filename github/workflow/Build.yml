name: Build APK

on:
  workflow_dispatch:
    inputs:
      llama_tag:
        description: 'llama.cpp tag (empty = latest release tag)'
        required: false
        default: ''
  push:
    paths: ['ComputerHunt-project.zip']

jobs:
  tools:
    name: Native tools (llama.cpp CLIs + stable-diffusion.cpp)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Pick tags
        run: |
          LTAG="${{ github.event.inputs.llama_tag }}"
          if [ -z "$LTAG" ]; then
            LTAG=$(git ls-remote --tags --refs --sort='-v:refname' https://github.com/ggml-org/llama.cpp | grep -E 'refs/tags/b[0-9]+$' | head -n1 | sed 's#.*refs/tags/##')
          fi
          STAG=$(git ls-remote --tags --refs --sort='-v:refname' https://github.com/leejet/stable-diffusion.cpp | grep -E 'refs/tags/master-[0-9]+-' | head -n1 | sed 's#.*refs/tags/##' || true)
          echo "LTAG=$LTAG" >> "$GITHUB_ENV"
          echo "STAG=$STAG" >> "$GITHUB_ENV"
          echo "llama.cpp tag: $LTAG / stable-diffusion.cpp tag: $STAG" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p out

      - name: Build llama-cli and llama-mtmd-cli (arm64, Cortex-A76 compatible)
        continue-on-error: true
        run: |
          set -e
          exec > >(tee build-llama.log) 2>&1
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          git clone --depth 1 --branch "$LTAG" https://github.com/ggml-org/llama.cpp llama.cpp
          cmake -S llama.cpp -B build-llama \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CPU_KLEIDIAI=OFF \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build-llama --config Release -j"$(nproc)" --target llama-cli llama-mtmd-cli
          find build-llama -type f -name llama-cli -exec cp {} out/libllama_cli.so \;
          find build-llama -type f -name llama-mtmd-cli -exec cp {} out/libllama_mtmd_cli.so \;

      - name: Build sd-cli (stable-diffusion.cpp, arm64)
        continue-on-error: true
        run: |
          set -e
          exec > >(tee build-sd.log) 2>&1
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          if [ -n "$STAG" ]; then
            git clone --depth 1 --branch "$STAG" --recursive --shallow-submodules https://github.com/leejet/stable-diffusion.cpp sdcpp
          else
            git clone --depth 1 --recursive --shallow-submodules https://github.com/leejet/stable-diffusion.cpp sdcpp
          fi
          cmake -S sdcpp -B build-sd \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CPU_KLEIDIAI=OFF \
            -DSD_BUILD_EXAMPLES=ON -DSD_BUILD_SHARED_LIBS=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build-sd --config Release -j"$(nproc)"
          SD=$(find build-sd -type f \( -name sd-cli -o -name sd \) | head -n1)
          echo "sd binary: $SD"
          cp "$SD" out/libsd_cli.so

      - name: Strip and list
        if: always()
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" out/*.so || true
          ls -la out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report results and build problems in the run summary
        if: always()
        run: |
          {
            echo "## tools result"
            for f in libllama_cli.so libllama_mtmd_cli.so libsd_cli.so; do
              if [ -f "out/$f" ]; then echo "- OK: $f"; else echo "- MISSING: $f"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f out/libllama_cli.so ] || [ ! -f out/libllama_mtmd_cli.so ]; then
            if [ -f build-llama.log ]; then
              { echo "### llama.cpp build log (last 40 lines)"; echo '```'; tail -n 40 build-llama.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ ! -f out/libsd_cli.so ]; then
            if [ -f build-sd.log ]; then
              { echo "### stable-diffusion.cpp build log (last 40 lines)"; echo '```'; tail -n 40 build-sd.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tools-arm64
          path: out/
          if-no-files-found: warn

  arm:
    name: APK with Arm engine (stable)
    needs: tools
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: unzip -q ComputerHunt-project.zip
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tools-arm64
          path: ComputerHunt/app/src/main/jniLibs/arm64-v8a
      - run: ls -la ComputerHunt/app/src/main/jniLibs/arm64-v8a || true
      - run: cd ComputerHunt && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-arm
          path: ComputerHunt/app/build/outputs/apk/debug/app-debug.apk

  latest:
    name: APK with NEW engine (llama.cpp built from source)
    needs: tools
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: unzip -q ComputerHunt-project.zip
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tools-arm64
          path: ComputerHunt/app/src/main/jniLibs/arm64-v8a
      - name: Clone llama.cpp
        run: |
          TAG="${{ github.event.inputs.llama_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git ls-remote --tags --refs --sort='-v:refname' https://github.com/ggml-org/llama.cpp | grep -E 'refs/tags/b[0-9]+$' | head -n1 | sed 's#.*refs/tags/##')
          fi
          echo "Using llama.cpp tag: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp llama.cpp
      - name: Show upstream Android project (for debugging)
        run: |
          cd llama.cpp/examples/llama.android
          ls -la
          cat settings.gradle.kts
          find lib -name '*.kt' | head -60
      - name: Put our app into the upstream project
        run: |
          A=llama.cpp/examples/llama.android
          rm -rf "$A/app"
          cp -r ComputerHunt/app "$A/app"
          sed -i 's#implementation("com.arm:ai-chat:0.1.0")#implementation(project(":lib"))#' "$A/app/build.gradle.kts"
          KT="$A/app/src/main/java/com/example/computerhunt/MainActivity.kt"
          PKGFILE=$(grep -rl 'object AiChat' "$A/lib/src" --include=*.kt | head -n1 || true)
          if [ -n "$PKGFILE" ]; then
            PKG=$(grep -m1 '^package ' "$PKGFILE" | awk '{print $2}')
            echo "AiChat package: $PKG"
            if [ -n "$PKG" ]; then sed -i "s/com\.arm\.aichat/$PKG/g" "$KT"; fi
          else
            echo "WARNING: could not find object AiChat in lib sources"
          fi
          sed -i "s#com.arm:ai-chat 0.1.0 (llama.cpp)#llama.cpp $TAG (built from source)#" "$KT"
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        working-directory: llama.cpp/examples/llama.android
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-latest
          path: llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk
``
